plugins { id 'com.android.application' }
android {
    namespace 'com.naslink.android'
    compileSdk 34
    defaultConfig {
        applicationId 'com.naslink.android'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '0.7.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static'; cppFlags '-std=c++17' } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    ndkVersion '27.2.12479018'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets.main.java.srcDir '../vendor/ZeroTierOne/java/src'
}

dependencies { implementation 'com.google.zxing:core:3.5.3' }
