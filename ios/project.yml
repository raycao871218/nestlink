name: NestLink
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
options:
  bundleIdPrefix: com.naslink
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: 0.7.0
    CURRENT_PROJECT_VERSION: 5
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "ZT_NO_PEER_METRICS", "NDEBUG"]
targets:
  NestLink:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: ../LICENSE
        buildPhase: resources
      - path: ../THIRD_PARTY.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naslink.ipad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIAppFonts: ["ZCOOLKuaiLe-Regular.ttf"]
        INFOPLIST_KEY_CFBundleDisplayName: 窝窝连
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a ZeroTier join code locally to fill in your connection settings.
    entitlements:
      path: App/NestLink.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    dependencies:
      - target: PacketTunnel
      - sdk: NetworkExtension.framework
    scheme:
      gatherCoverageData: false
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
      - Shared
      - Native
      - path: ../vendor/ZeroTierOne/node
        includes: ["*.cpp"]
      - path: ../vendor/ZeroTierOne/osdep/OSUtils.cpp
      - path: ../app/src/main/assets/bootstrap/planet
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naslink.ipad.PacketTunnel
        SWIFT_OBJC_BRIDGING_HEADER: PacketTunnel/PacketTunnel-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Native
          - $(SRCROOT)/../vendor/ZeroTierOne/include
          - $(SRCROOT)/../vendor/ZeroTierOne/node
          - $(SRCROOT)/../vendor/ZeroTierOne/ext
          - $(SRCROOT)/../vendor/ZeroTierOne/ext/prometheus-cpp-lite-1.0/core/include
          - $(SRCROOT)/../vendor/ZeroTierOne/ext/prometheus-cpp-lite-1.0/simpleapi/include
          - $(SRCROOT)/../vendor/ZeroTierOne/ext/prometheus-cpp-lite-1.0/3rdparty/http-client-lite/include
          - $(SRCROOT)/../vendor/ZeroTierOne/ext/opentelemetry-cpp-api-only/include
        GCC_OPTIMIZATION_LEVEL: s
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: NestLink Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    dependencies:
      - sdk: NetworkExtension.framework
